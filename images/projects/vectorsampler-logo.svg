<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Dark rounded background (matches app theme) -->
  <rect width="512" height="512" rx="90" ry="90" fill="#121212"/>

  <!-- Left arm of the V (jagged vector-style waveform) -->
  <polyline
    points="130,140 160,195 140,250 175,305 150,360 256,410"
    fill="none"
    stroke="#FF9A00"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Right arm of the V (mirrored jagged waveform) -->
  <polyline
    points="382,140 352,195 372,250 337,305 362,360 256,410"
    fill="none"
    stroke="#FF9A00"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Polished tip accent (matches the glowing orange UI elements) -->
  <circle cx="256" cy="410" r="22" fill="#FF9A00"/>
</svg>
