# YouTube to Apple Podcasts Sync Workflow
#
# Automatically converts Larry Seyer's YouTube show into a podcast feed.
# Runs every Saturday at 10 AM Central, or manually via workflow_dispatch.
#
# Required secrets:
#   IA_ACCESS_KEY - Internet Archive S3 access key
#   IA_SECRET_KEY - Internet Archive S3 secret key
#
# Get credentials at: https://archive.org/account/s3.php

name: Podcast Sync

on:
  # Run every Saturday at 10 AM Central (16:00 UTC)
  schedule:
    - cron: '0 16 * * 6'

  # Manual trigger with optional backfill
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Process all videos from 2024 onward'
        required: false
        default: 'false'
        type: boolean
      video_id:
        description: 'Process a single video ID (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    name: Sync YouTube to Podcast
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/podcast/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/podcast/requirements.txt

      - name: Install yt-dlp
        run: |
          # Install latest yt-dlp for best YouTube compatibility
          pip install --upgrade yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run sync script
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          cd scripts/podcast

          # Build command based on inputs
          CMD="python sync.py"

          if [ "${{ github.event.inputs.backfill }}" == "true" ]; then
            CMD="$CMD --backfill"
          fi

          if [ -n "${{ github.event.inputs.video_id }}" ]; then
            CMD="$CMD --video-id=${{ github.event.inputs.video_id }}"
          fi

          echo "Running: $CMD"
          $CMD

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet podcast/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add podcast/
          git commit -m "Update podcast feed - $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: Summary
        run: |
          echo "## Podcast Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f podcast/episodes.json ]; then
            EPISODE_COUNT=$(python -c "import json; print(len(json.load(open('podcast/episodes.json'))))")
            echo "Total episodes in feed: $EPISODE_COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "No episodes processed yet." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Feed URL: https://larryseyer.com/podcast/feed.xml" >> $GITHUB_STEP_SUMMARY
